# PoC: Fenster- und Türstatus auf dem ehemaligen FRITZ!Box-Anruflisten-Display
# Hardware: LOLIN D32 (ESP32) + Waveshare 4.2" e-Paper V1 (UC8176, 400x300 s/w)
#           4 Taster nach +3V3 (GPIO 12/14/13/15 = Angenommen/Verpasst/Abgehend/Alle), interne Pulldowns

substitutions:
  name: fenster-display
  friendly_name: Fenster-Display

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: lolin_d32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

display:
  # Hinweis: waveshare_epaper ist ab ESPHome 2026.x deprecated (Entfernung 2027.5).
  # Der Nachfolger epaper_spi unterstützt den UC8176 (4.2" V1) noch nicht.
  - platform: waveshare_epaper
    id: epd
    model: 4.20in
    cs_pin:
      number: GPIO5
      ignore_strapping_warning: true
    dc_pin: GPIO17
    reset_pin: GPIO16
    busy_pin: GPIO4
    rotation: 270 # Display hängt hochkant
    update_interval: never # nur bei Zustandsänderung neu zeichnen (siehe script.refresh)
    lambda: |-
      // ---- Zustände einsammeln: 0 = zu, 1 = offen, 2 = gekippt, -1 = unbekannt
      auto bs = [](binary_sensor::BinarySensor *s) -> int {
        return s->has_state() ? (s->state ? 1 : 0) : -1;
      };
      auto ts = [](text_sensor::TextSensor *s) -> int {
        if (!s->has_state()) return -1;
        if (s->state == "closed") return 0;
        if (s->state == "open") return 1;
        if (s->state == "tilted") return 2;
        return -1;
      };

      struct Item { const char *name; int state; bool door; };
      const Item eg[] = {
        {"Haustür",     bs(id(c_haustuer)), true},
        {"Wohnzimmer",  bs(id(c_wohnzimmer)), false},
        {"Küche",       bs(id(c_kueche)), false},
        {"WC",          bs(id(c_wc)), false},
      };
      const Item og[] = {
        {"Bad",         bs(id(c_bad_og)), false},
        {"Spielzimmer", bs(id(c_spielzimmer)), false},
        {"Balkontür",   ts(id(s_balkontuer)), true},
        {"Korbinian",   bs(id(c_korbinian)), false},
        {"Tobias",      bs(id(c_tobias)), false},
      };
      const Item dg[] = {
        {"SZ Velux",    bs(id(c_velux)), false},
        {"SZ Mitte",    bs(id(c_mitte)), false},
        {"Bad",         bs(id(c_bad_dg)), false},
      };

      int n_open = 0, n_unknown = 0;
      auto count = [&](const Item *items, int n) {
        for (int i = 0; i < n; i++) {
          if (items[i].state > 0) n_open++;
          if (items[i].state < 0) n_unknown++;
        }
      };
      count(eg, 4); count(og, 5); count(dg, 3);

      // ---- Layout: Hochformat 300 x 400 (Display hängt hochkant, rotation: 270)
      const int W = 300;

      // ---- Kopfzeile
      it.filled_rectangle(0, 0, W, 32);
      it.print(8, 16, id(f_title), COLOR_OFF, TextAlign::CENTER_LEFT, "Fenster & Türen");
      if (!id(ha_status).state) {
        it.print(W - 6, 16, id(f_small), COLOR_OFF, TextAlign::CENTER_RIGHT, "keine Verbindung");
      } else {
        auto now = id(ha_time).now();
        if (now.is_valid())
          it.strftime(W - 6, 16, id(f_name), COLOR_OFF, TextAlign::CENTER_RIGHT, "%H:%M", now);
      }

      // ---- Zusammenfassung
      if (n_open == 0 && n_unknown == 0) {
        it.print(8, 53, id(f_icon_l), TextAlign::CENTER_LEFT, "\U000F05E0");  // check-circle
        it.print(50, 53, id(f_big), TextAlign::CENTER_LEFT, "Alles geschlossen");
      } else if (n_open == 0) {
        it.print(8, 53, id(f_icon_l), TextAlign::CENTER_LEFT, "\U000F0028");  // alert-circle
        it.printf(50, 53, id(f_big), TextAlign::CENTER_LEFT, "%d unbekannt", n_unknown);
      } else {
        it.print(8, 53, id(f_icon_l), TextAlign::CENTER_LEFT, "\U000F0026");  // alert
        it.printf(50, 53, id(f_big), TextAlign::CENTER_LEFT, "%d offen", n_open);
        if (n_unknown > 0)
          it.printf(W - 6, 53, id(f_name), TextAlign::CENTER_RIGHT, "%d unbekannt", n_unknown);
      }

      // ---- Abschnitte je Stockwerk, darin 2 Spalten
      const int ROW = 33, BOX_W = 144, BOX_H = 30;
      int y0 = 76;
      auto draw_floor = [&](const char *floor, const Item *items, int n) {
        it.print(6, y0 + 9, id(f_floor), TextAlign::CENTER_LEFT, floor);
        it.horizontal_line(4, y0 + 20, W - 8);
        int top = y0 + 22;
        for (int i = 0; i < n; i++) {
          const Item &e = items[i];
          int x = 4 + (i % 2) * (BOX_W + 4);
          int y = top + (i / 2) * ROW;
          Color fg = COLOR_ON;
          if (e.state > 0) {             // offen/gekippt: invertiert hervorheben
            it.filled_rectangle(x, y, BOX_W, BOX_H);
            fg = COLOR_OFF;
          } else if (e.state < 0) {      // unbekannt: Rahmen
            it.rectangle(x, y, BOX_W, BOX_H);
          }
          const char *icon = e.door ? (e.state > 0 ? "\U000F081C" : "\U000F081B")   // door-open / door-closed
                                    : (e.state > 0 ? "\U000F11DC" : "\U000F11DB");  // window-open/closed-variant
          it.print(x + 4, y + BOX_H / 2, id(f_icon), fg, TextAlign::CENTER_LEFT, icon);
          if (e.state == 0) {
            it.print(x + 36, y + BOX_H / 2, id(f_name), fg, TextAlign::CENTER_LEFT, e.name);
          } else {
            const char *sub = e.state == 1 ? "offen" : e.state == 2 ? "gekippt" : "unbekannt";
            it.print(x + 36, y + 9, id(f_name), fg, TextAlign::CENTER_LEFT, e.name);
            it.print(x + 36, y + 23, id(f_small), fg, TextAlign::CENTER_LEFT, sub);
          }
        }
        y0 = top + ((n + 1) / 2) * ROW + 4;
      };
      draw_floor("EG", eg, 4);
      draw_floor("OG", og, 5);
      draw_floor("DG", dg, 3);

script:
  # Entprellt Zustandsänderungen: mehrere Änderungen kurz hintereinander -> ein Refresh
  - id: refresh
    mode: restart
    then:
      - delay: 2s
      - component.update: epd

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto@700"
    id: f_title
    size: 20
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@700"
    id: f_big
    size: 24
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@700"
    id: f_floor
    size: 17
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@400"
    id: f_name
    size: 16
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@400"
    id: f_small
    size: 12
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: &mdi "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icon
    size: 28
    glyphs:
      - "\U000F081B" # door-closed
      - "\U000F081C" # door-open
      - "\U000F11DB" # window-closed-variant
      - "\U000F11DC" # window-open-variant
  - file: *mdi
    id: f_icon_l
    size: 36
    glyphs:
      - "\U000F05E0" # check-circle
      - "\U000F0028" # alert-circle
      - "\U000F0026" # alert

# ---------------------------------------------------------------------------
# Zustände aus Home Assistant
# ---------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: s_balkontuer
    entity_id: sensor.spielzimmer_sz_fenstergriffsensor_balkontur_fensterzustand
    internal: true
    on_value:
      - script.execute: refresh

binary_sensor:
  - platform: status
    id: ha_status
    name: Status
    on_state:
      - script.execute: refresh

  # EG
  - platform: homeassistant
    id: c_haustuer
    entity_id: binary_sensor.fenster_und_turkontakt_mit_magnet
    internal: true
    on_state: {then: [script.execute: refresh]}
  - platform: homeassistant
    id: c_wohnzimmer
    entity_id: binary_sensor.fenster_und_turkontakt
    internal: true
    on_state: {then: [script.execute: refresh]}
  - platform: homeassistant
    id: c_kueche
    entity_id: binary_sensor.kuche_fenster_und_turkontakt
    internal: true
    on_state: {then: [script.execute: refresh]}
  - platform: homeassistant
    id: c_wc
    entity_id: binary_sensor.fensterkontakt_2
    internal: true
    on_state: {then: [script.execute: refresh]}

  # OG
  - platform: homeassistant
    id: c_bad_og
    entity_id: binary_sensor.fensterkontakt
    internal: true
    on_state: {then: [script.execute: refresh]}
  - platform: homeassistant
    id: c_spielzimmer
    entity_id: binary_sensor.fenster_und_turkontakt_spielzimmer
    internal: true
    on_state: {then: [script.execute: refresh]}
  - platform: homeassistant
    id: c_korbinian
    entity_id: binary_sensor.fensterkontakt_3
    internal: true
    on_state: {then: [script.execute: refresh]}
  - platform: homeassistant
    id: c_tobias
    entity_id: binary_sensor.fensterkontakt_4
    internal: true
    on_state: {then: [script.execute: refresh]}

  # DG
  - platform: homeassistant
    id: c_velux
    entity_id: binary_sensor.fensterkontakt_velux
    internal: true
    on_state: {then: [script.execute: refresh]}
  - platform: homeassistant
    id: c_mitte
    entity_id: binary_sensor.fensterkontakt_mitte
    internal: true
    on_state: {then: [script.execute: refresh]}
  - platform: homeassistant
    id: c_bad_dg
    entity_id: binary_sensor.shutter_contact
    internal: true
    on_state: {then: [script.execute: refresh]}

  # Taster (schalten +3V3, daher Pulldown, nicht invertiert).
  # Im PoC: jeder Taster erzwingt einen Refresh; zusätzlich als Entität in HA nutzbar.
  - platform: gpio
    id: btn_1
    name: Taste Angenommen
    pin:
      number: GPIO12
      mode: {input: true, pulldown: true}
      ignore_strapping_warning: true # Taster beim Booten nicht gedrückt halten!
    filters: [delayed_on: 20ms]
    on_press: [component.update: epd]
  - platform: gpio
    id: btn_2
    name: Taste Verpasst
    pin:
      number: GPIO14
      mode: {input: true, pulldown: true}
    filters: [delayed_on: 20ms]
    on_press: [component.update: epd]
  - platform: gpio
    id: btn_3
    name: Taste Abgehend
    pin:
      number: GPIO13
      mode: {input: true, pulldown: true}
    filters: [delayed_on: 20ms]
    on_press: [component.update: epd]

  - platform: gpio
    id: btn_4
    name: Taste Alle
    pin:
      number: GPIO15
      mode: {input: true, pulldown: true}
      ignore_strapping_warning: true # Strapping-Pin, im Betrieb unkritisch
    filters: [delayed_on: 20ms]
    on_press: [component.update: epd]

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 5min
