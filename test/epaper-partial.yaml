# Teilrefresh-Test für das Haus-Display (Waveshare 4.2" V1, UC8176) mit epaper_spi
# (Kopie von parkghost/esphome-epaper in components/ dieses Repos, ergänzt um Waveshare-V1-Modelle
# und eine zur Laufzeit einstellbare Teilrefresh-Waveform).
#
# Die Waveform-Parameter werden aus einer Liste von Kombinationen (partial_combos.h) umgeschaltet,
# die aktuelle Nummer steht groß oben links. Nummer merken, fertig.
#   Kombi 0 = Werte aus den Substitutionen t1..t6, vcom_dc, pll (per "esphome -s t3 60 ..." änderbar)
#
# Tasten (von hinten gesehen links = 1):
#   Taste 1  ein Teilrefresh (Zähler +1, Balken wandert)
#   Taste 2  großen Block invertieren + Teilrefresh (Härtetest für Geisterbilder)
#   Taste 3  automatischer Durchlauf an/aus: je Kombi 1 Voll-Refresh, dann 6 Teilrefreshes im
#            Abstand von 8 s (jeder zweite mit Block-Invertierung), dann die nächste Kombi
#   Taste 4  nächste Kombi von Hand (mit Voll-Refresh als sauberer Ausgangspunkt)
# Ohne Durchlauf ist jedes ${full_every}. Update ein Voll-Refresh.
# Im Log: "Partial waveform: …" beim Umschalten und "Display update took … ms" nach jedem Update.

substitutions:
  name: haus-display
  friendly_name: Haus-Display
  full_every: "10"
  model: waveshare-4.2in-v1-tune
  # Kombi 0
  t1: "60"
  t2: "60"
  t3: "60"
  t4: "60"
  t5: "10"
  t6: "10"
  vcom_dc: "0x12"
  pll: "0x3A"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - partial_combos.h
  on_boot:
    priority: -100
    then:
      - script.execute: apply_combo
      - delay: 3s
      - component.update: epd

esp32:
  board: lolin_d32
  framework:
    type: esp-idf

external_components:
  # aus diesem Repo (components/epaper_spi), damit es auch im ESPHome-Dashboard ohne lokale Kopie geht
  - source: github://jfraf/homeassistant-epaper@main
    components: [epaper_spi]
    refresh: 0s

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: n_updates   # Anzahl gezeichneter Frames seit dem Start
    type: int
    initial_value: '0'
  - id: upd_cnt     # spiegelt den Voll/Teil-Zähler des Treibers (0 = nächstes Update ist voll)
    type: int
    initial_value: '0'
  - id: inverted    # Zustand des Invertier-Blocks
    type: bool
    initial_value: 'false'
  - id: sweep_on
    type: bool
    initial_value: 'false'
  - id: sweep_step
    type: int
    initial_value: '0'
  - id: combo       # aktuelle Kombi
    type: int
    initial_value: '0'

script:
  - id: apply_combo
    then:
      - lambda: |-
          const auto c = hd_test::combo(id(combo), ${t1}, ${t2}, ${t3}, ${t4}, ${t5}, ${t6}, ${vcom_dc}, ${pll});
          id(epd).set_partial_waveform(c.t[0], c.t[1], c.t[2], c.t[3], c.t[4], c.t[5], c.vcom, c.pll);
  - id: next_combo
    then:
      - lambda: |-
          id(combo) = (id(combo) + 1) % hd_test::NUM_COMBOS;
          id(sweep_step) = 0;
          id(epd).force_full_update();
          id(upd_cnt) = 0;
      - script.execute: apply_combo
      - component.update: epd

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

display:
  - platform: epaper_spi
    id: epd
    model: ${model}
    cs_pin:
      number: GPIO5
      ignore_strapping_warning: true
    dc_pin: GPIO17
    reset_pin: GPIO16
    busy_pin: GPIO4   # Polarität kennt der Treiber, nicht invertieren
    rotation: 270
    full_update_every: ${full_every}
    update_interval: never
    lambda: |-
      // epaper_spi: Farben WYSIWYG, Schwarz = Color(0,0,0)
      const auto BLACK = Color(0, 0, 0);
      const auto WHITE = Color(255, 255, 255);
      const int W = 300;
      const int n = id(n_updates)++;
      const bool full = id(upd_cnt) == 0;
      id(upd_cnt) = (id(upd_cnt) + 1) % ${full_every};
      const auto c = hd_test::combo(id(combo), ${t1}, ${t2}, ${t3}, ${t4}, ${t5}, ${t6}, ${vcom_dc}, ${pll});

      it.fill(WHITE);

      // Kopfzeile: Kombi-Nummer groß, Parameter klein
      it.filled_rectangle(0, 0, W, 44, BLACK);
      it.printf(8, 22, id(f_big_s), WHITE, TextAlign::CENTER_LEFT, "%d", id(combo));
      it.printf(64, 13, id(f_12), WHITE, TextAlign::CENTER_LEFT, "T %u/%u/%u/%u/%u/%u",
                c.t[0], c.t[1], c.t[2], c.t[3], c.t[4], c.t[5]);
      // reine Waveform-Dauer: Summe T1-T4 in Frames, 0x3A = 100 Hz, 0x3C = 50 Hz
      const float secs = (c.t[0] + c.t[1] + c.t[2] + c.t[3]) / (c.pll == 0x3C ? 50.0f : 100.0f);
      it.printf(64, 31, id(f_12), WHITE, TextAlign::CENTER_LEFT, "VCOM 0x%02X · PLL 0x%02X · %.1f s",
                c.vcom, c.pll, secs);
      it.print(W - 8, 13, id(f_12), WHITE, TextAlign::CENTER_RIGHT, id(sweep_on) ? "Durchlauf" : "manuell");
      auto t = id(ha_time).now();
      if (t.is_valid())
        it.strftime(W - 8, 31, id(f_12), WHITE, TextAlign::CENTER_RIGHT, "%H:%M:%S", t);

      // Großer Zähler
      it.printf(W / 2, 100, id(f_big), BLACK, TextAlign::CENTER, "%d", n);
      it.print(W / 2, 145, id(f_15), BLACK, TextAlign::CENTER, full ? "VOLL-Refresh" : "Teilrefresh");

      // Wandernder Balken (lokale Änderung)
      it.rectangle(10, 162, 280, 20, BLACK);
      const int pos = (n * 23) % 250;
      it.filled_rectangle(12 + pos, 164, 26, 16, BLACK);

      // Statische Referenz: Schachbrett 4 px und feine Linien (dürfen sich nie verändern)
      for (int y = 0; y < 64; y += 4)
        for (int x = 0; x < 128; x += 4)
          if (((x + y) / 4) % 2 == 0) it.filled_rectangle(10 + x, 195 + y, 4, 4, BLACK);
      for (int i = 0; i < 8; i++) it.horizontal_line(150, 195 + i * 9, 140, BLACK);

      // Invertier-Block (Härtetest)
      const auto bg = id(inverted) ? BLACK : WHITE;
      const auto fg = id(inverted) ? WHITE : BLACK;
      it.filled_rectangle(10, 270, 280, 80, bg);
      it.rectangle(10, 270, 280, 80, BLACK);
      it.print(W / 2, 300, id(f_22b), fg, TextAlign::CENTER, id(inverted) ? "invertiert" : "normal");
      it.print(W / 2, 328, id(f_12), fg, TextAlign::CENTER, "Kleiner Text 12 px: Ladelimit 80 % · 3,4 kWh");

      // Fußzeile
      it.print(W / 2, 372, id(f_12), BLACK, TextAlign::CENTER, "T1 Update · T2 Block invertieren");
      it.print(W / 2, 388, id(f_12), BLACK, TextAlign::CENTER, "T3 Durchlauf an/aus · T4 nächste Kombi");

      ESP_LOGI("test", "Frame %d (%s), Kombi %d", n, full ? "voll" : "teil", id(combo));

font:
  - file: gfonts://Arimo@700
    id: f_22b
    size: 22
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: gfonts://Arimo@700
    id: f_big
    size: 72
    glyphs: "0123456789"
  - file: gfonts://Arimo@700
    id: f_big_s
    size: 36
    glyphs: "0123456789"
  - file: gfonts://Arimo@400
    id: f_15
    size: 15
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: gfonts://Arimo@400
    id: f_12
    size: 12
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true

interval:
  # Durchlauf: nach 6 Teilrefreshes nächste Kombi (mit Voll-Refresh)
  - interval: 8s
    then:
      - if:
          condition:
            lambda: return id(sweep_on);
          then:
            - if:
                condition:
                  lambda: return id(sweep_step) >= 6;
                then:
                  - script.execute: next_combo
                else:
                  - lambda: |-
                      id(sweep_step)++;
                      if (id(sweep_step) % 2 == 0) id(inverted) = !id(inverted);
                  - component.update: epd

binary_sensor:
  - platform: gpio
    id: btn_1
    name: Taste 1
    pin:
      number: GPIO12
      mode: {input: true, pulldown: true}
      ignore_strapping_warning: true # Taster beim Booten nicht gedrückt halten!
    filters: [delayed_on: 20ms]
    on_press: [component.update: epd]
  - platform: gpio
    id: btn_2
    name: Taste 2
    pin:
      number: GPIO14
      mode: {input: true, pulldown: true}
    filters: [delayed_on: 20ms]
    on_press:
      - lambda: id(inverted) = !id(inverted);
      - component.update: epd
  - platform: gpio
    id: btn_3
    name: Taste 3
    pin:
      number: GPIO13
      mode: {input: true, pulldown: true}
    filters: [delayed_on: 20ms]
    on_press:
      - lambda: |-
          id(sweep_on) = !id(sweep_on);
          id(sweep_step) = 6;  // beim Start sofort mit der nächsten Kombi beginnen
      - component.update: epd
  - platform: gpio
    id: btn_4
    name: Taste 4
    pin:
      number: GPIO15
      mode: {input: true, pulldown: true}
      ignore_strapping_warning: true
    filters: [delayed_on: 20ms]
    on_press: [script.execute: next_combo]
