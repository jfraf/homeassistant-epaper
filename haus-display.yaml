# ---------------------------------------------------------------------------
# Daten aus Home Assistant
# ---------------------------------------------------------------------------
sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: WLAN-Signal
    update_interval: 5min

  # "Langsame" Werte: lösen keinen sofortigen Refresh aus (siehe interval)
  - {platform: homeassistant, id: pv_power,  entity_id: sensor.solaredge_ac_power, internal: true}
  - {platform: homeassistant, id: pv_today,  entity_id: sensor.solaredge_pv_dc_ertrag_heute, internal: true}
  - {platform: homeassistant, id: fc_rest_1, entity_id: sensor.energy_production_today_remaining, internal: true}
  - {platform: homeassistant, id: fc_rest_2, entity_id: sensor.energy_production_today_remaining_2, internal: true}
  - {platform: homeassistant, id: fc_tom_1,  entity_id: sensor.energy_production_tomorrow, internal: true}
  - {platform: homeassistant, id: fc_tom_2,  entity_id: sensor.energy_production_tomorrow_2, internal: true}
  - {platform: homeassistant, id: car_soc,   entity_id: sensor.skoda_enyaq_batteriestand, internal: true}
  - {platform: homeassistant, id: car_range, entity_id: sensor.skoda_enyaq_reichweite, internal: true}
  - {platform: homeassistant, id: car_limit, entity_id: sensor.skoda_enyaq_ladegrenze_in_prozent, internal: true}
  - {platform: homeassistant, id: car_charge_power, entity_id: sensor.skoda_enyaq_ladeleistung, internal: true}
  - {platform: homeassistant, id: wm_progress, entity_id: sensor.siemens_wm14ur5em2_68a40e98d48e_bsh_common_option_programprogress, internal: true}

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
  # Termine aller Kalender (Template-Sensor in HA, siehe homeassistant/haus_display_termine.yaml)
  - {platform: homeassistant, id: cal_text, entity_id: sensor.haus_display_termine, attribute: text, internal: true, on_value: {then: [script.execute: refresh]}}
  # Sofort-Refresh
  - {platform: homeassistant, id: s_balkontuer, entity_id: sensor.spielzimmer_sz_fenstergriffsensor_balkontur_fensterzustand, internal: true, on_value: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: garage, entity_id: cover.garage_garagentor_tor, internal: true, on_value: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: car_charge_state, entity_id: sensor.skoda_enyaq_ladestatus, internal: true, on_value: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: wb_mode, entity_id: sensor.openwb_lademodus, internal: true, on_value: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: wm_state, entity_id: sensor.siemens_wm14ur5em2_68a40e98d48e_bsh_common_status_operationstate, internal: true, on_value: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: wm_program, entity_id: sensor.siemens_wm14ur5em2_68a40e98d48e_active_program, internal: true, on_value: {then: [script.execute: refresh]}}
  # Langsam (über Signatur)
  - {platform: homeassistant, id: wm_remaining, entity_id: sensor.siemens_wm14ur5em2_68a40e98d48e_bsh_common_option_remainingprogramtime, internal: true}
  - {platform: homeassistant, id: wm_finish_rel, entity_id: sensor.siemens_wm14ur5em2_68a40e98d48e_bsh_common_option_finishinrelative, internal: true}

binary_sensor:
  - platform: status
    id: ha_status
    name: Status
    on_state:
      - lambda: |-
          if (x) {
            id(offline_full) = false;
          } else {
            auto n = id(ha_time).now();
            id(offline_since) = n.is_valid() ? (uint32_t) n.timestamp : 0;
          }
      - if:
          condition:
            lambda: return x;
          then:
            - script.stop: offline_watch
          else:
            - script.execute: offline_watch
      - script.execute: refresh

  # Fenster & Türen
  - {platform: homeassistant, id: c_haustuer,    entity_id: binary_sensor.fenster_und_turkontakt_mit_magnet, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_wohnzimmer,  entity_id: binary_sensor.fenster_und_turkontakt, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_kueche,      entity_id: binary_sensor.kuche_fenster_und_turkontakt, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_wc,          entity_id: binary_sensor.fensterkontakt_2, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_bad_og,      entity_id: binary_sensor.fensterkontakt, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_spielzimmer, entity_id: binary_sensor.fenster_und_turkontakt_spielzimmer, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_korbinian,   entity_id: binary_sensor.fensterkontakt_3, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_tobias,      entity_id: binary_sensor.fensterkontakt_4, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_velux,       entity_id: binary_sensor.fensterkontakt_velux, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_mitte,       entity_id: binary_sensor.fensterkontakt_mitte, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: c_bad_dg,      entity_id: binary_sensor.shutter_contact, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}

  # Auto
  - {platform: homeassistant, id: car_doors,   entity_id: binary_sensor.skoda_enyaq_turen_offen, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: car_windows, entity_id: binary_sensor.skoda_enyaq_fenster, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: car_trunk,   entity_id: binary_sensor.skoda_enyaq_kofferraum, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: car_hood,    entity_id: binary_sensor.skoda_enyaq_motorhaube, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}
  - {platform: homeassistant, id: car_plug,    entity_id: binary_sensor.skoda_enyaq_ladekabel, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}

  # Waschmaschine
  - {platform: homeassistant, id: wm_connected, entity_id: binary_sensor.siemens_wm14ur5em2_68a40e98d48e_connected, internal: true, trigger_on_initial_state: true, on_state: {then: [script.execute: refresh]}}

  # Taster (schalten +3V3, daher Pulldown, nicht invertiert). Im Moment: Refresh (Einmal-Blinken) erzwingen.
  - platform: gpio
    id: btn_1
    name: Taste 1
    pin:
      number: GPIO12
      mode: {input: true, pulldown: true}
      ignore_strapping_warning: true # Taster beim Booten nicht gedrückt halten!
    filters: [delayed_on: 20ms]
    on_press:
      - lambda: id(force_flash) = true;
      - script.execute: draw_safe
  - platform: gpio
    id: btn_2
    name: Taste 2
    pin:
      number: GPIO14
      mode: {input: true, pulldown: true}
    filters: [delayed_on: 20ms]
    on_press:
      - lambda: id(force_flash) = true;
      - script.execute: draw_safe
  - platform: gpio
    id: btn_3
    name: Taste 3
    pin:
      number: GPIO13
      mode: {input: true, pulldown: true}
    filters: [delayed_on: 20ms]
    on_press:
      - lambda: id(force_flash) = true;
      - script.execute: draw_safe
  - platform: gpio
    id: btn_4
    name: Taste 4
    pin:
      number: GPIO15
      mode: {input: true, pulldown: true}
      ignore_strapping_warning: true # Strapping-Pin, im Betrieb unkritisch
    filters: [delayed_on: 20ms]
    on_press:
      - lambda: id(force_flash) = true;
      - script.execute: draw_safe

# 2 × APA106-F8 / P9823 in Reihe an GPIO27, Versorgung 5 V.
# Benennung wie die Tasten (von hinten gesehen links = 1): "LED 1" ist die zweite LED der Kette (Index 1),
# "LED 2" die erste (Index 0, DIN am GPIO27).
light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    name: LEDs
    internal: true
    pin: GPIO27
    num_leds: 2
    chipset: WS2812 # gleiches Timing wie im erfolgreichen Nano-Test (800 kHz)
    channel_colors: RGB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
  - platform: partition
    id: led_1
    name: LED 1
    default_transition_length: 0.5s
    restore_mode: ALWAYS_OFF
    segments:
      - id: led_strip
        from: 1
        to: 1
    effects:
      - pulse:
          name: Warnung # sanftes Pulsieren zwischen 25 % und 100 %
          transition_length: 1.2s
          update_interval: 1.2s
          min_brightness: 25%
          max_brightness: 100%
      - pulse:
      - strobe:
  - platform: partition
    id: led_2
    name: LED 2
    default_transition_length: 0.5s
    restore_mode: ALWAYS_OFF
