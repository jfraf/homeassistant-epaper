# ---------------------------------------------------------------------------
font:
  # Arimo (metrisch kompatibel zu Arial): rastert bei 1 Bit auch in 10–12 px sauber (Arial-Hinting),
  # normal und fett aus einer Familie (verglichen mit Roboto, DejaVu, Noto, Open Sans, PT Sans, Fira, IBM Plex).
  - {file: "gfonts://Arimo@700", id: f_15b, size: 15, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true}
  - {file: "gfonts://Arimo@400", id: f_15, size: 15, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true}
  - {file: "gfonts://Arimo@700", id: f_sec, size: 12, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true}
  - {file: "gfonts://Arimo@400", id: f_14, size: 14, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true}
  - {file: "gfonts://Arimo@400", id: f_13, size: 13, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true}
  - {file: "gfonts://Arimo@400", id: f_12, size: 12, glyphsets: [GF_Latin_Core], ignore_missing_glyphs: true}
