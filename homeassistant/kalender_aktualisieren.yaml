# Ruft den ICS-Kalender (Remote Calendar) alle 30 Minuten neu ab, statt nur alle 24 Stunden.
# Einbau: Datei unverändert in den Ordner "packages" der Home-Assistant-Konfiguration legen,
# Konfiguration prüfen, Home Assistant neu starten.

automation:
  - id: kalender_moffler_aktualisieren
    alias: Kalender Moffler halbstündlich aktualisieren
    mode: single
    trigger:
      - trigger: time_pattern
        minutes: "/30"
    action:
      - action: homeassistant.update_entity
        target:
          entity_id: calendar.moffler
